<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PackIt brick seal preview</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font: 14px sans-serif; color: #173e46; }
      header { padding: 12px 16px; display: flex; align-items: center; flex-wrap: wrap; gap: 12px; border-bottom: 1px solid #d9e3e5; }
      h1 { margin: 0; font-size: 16px; }
      select, button { min-height: 32px; font: inherit; }
      canvas { display: block; width: 100%; height: calc(100dvh - 110px); min-height: 300px; }
      output { display: block; padding: 12px 16px; font-size: 12px; }
    </style>
  </head>
  <body>
    <header>
      <h1>Brick Pouch: 20 mm Seals</h1>
      <select id="size" aria-label="Pouch size">
        <option value="coffee">80 x 50 x 120 mm</option>
        <option value="reported">250 x 150 x 150 mm</option>
      </select>
      <select id="view" aria-label="Camera view">
        <option value="front">Three-quarter front</option>
        <option value="back">Three-quarter back</option>
        <option value="bottom">Underneath</option>
      </select>
      <label><input id="grid" type="checkbox" /> Calibration grid</label>
    </header>
    <canvas id="scene" aria-label="Brick pouch with longer top and folded bottom seals"></canvas>
    <output id="result">Loading</output>
    <script type="module" src="./brick-seals.ts"></script>
  </body>
</html>
